name: Scrape events

on:
  schedule:
    - cron: "0 12 * * *"  # backup only; cron-job.org triggers this on time
  workflow_dispatch: {}    # lets you trigger manually from the Actions tab

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
        run: python main.py

      - name: Instant phone alerts (people who turned them on)
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python push_alerts.py --mode instant

      - name: Offline tests
        if: always()
        working-directory: scraper
        run: pip install pytest && python -m pytest tests -q
